name: framework-ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_adapters.py --check
      - run: python scripts/sdlc.py check
      - run: python -m compileall -q scripts tests templates/projects

  starter-smoke:
    strategy:
      matrix:
        template: [python-cli, python-chatbot, python-fastapi-ai]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/projects/${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: templates/projects/${{ matrix.template }}/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app tests
      - run: python -m pytest -q
